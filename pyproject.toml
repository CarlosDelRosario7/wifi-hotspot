[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wifi-hotspot"
version = "0.1.0"
description = "Modern Linux Wi-Fi hotspot manager"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Carlos Del Rosario", email = "65183782+CarlosDelRosario7@users.noreply.github.com" },
]
keywords = ["wifi", "hotspot", "linux", "hostapd", "dnsmasq", "gtk4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/CarlosDelRosario7/wifi-hotspot"
Repository = "https://github.com/CarlosDelRosario7/wifi-hotspot"
Issues = "https://github.com/CarlosDelRosario7/wifi-hotspot/issues"
Changelog = "https://github.com/CarlosDelRosario7/wifi-hotspot/blob/main/CHANGELOG.md"

[project.scripts]
wifi-hotspot = "wifi_hotspot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wifi_hotspot = [
  "gui/ui/*.ui",
  "gui/resources/*",
  "gui/resources/**/*",
  "data/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires root, hostapd, dnsmasq and real or simulated Wi-Fi hardware",
]

[tool.coverage.run]
source = ["wifi_hotspot"]
omit = ["*/gui/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
